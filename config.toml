# FlowText — Konfiguration
#
# Persönliche Overrides gehören in config.local.toml (nicht im Git).
# Alle Werte sind optional; fehlende Schlüssel nutzen die Defaults.

[hotkey]
# "double_tap" (Standard) oder "combo".
#
# WARNUNG zu "combo": <ctrl>+<alt>+<space> ist ein macOS-Systemkurzbefehl
# ("nächste Eingabequelle"). Er wechselt die Tastaturbelegung und tippt wegen
# Option+Space ein geschütztes Leerzeichen (U+00A0) ins fokussierte Textfeld.
# Nicht verwenden.
mode = "double_tap"

# Doppel-Tap: generisch (cmd, shift, ctrl) oder seitenspezifisch (cmd_r, shift_r, ctrl_r).
tap_key = "cmd"
double_tap_window = 0.50   # max. Abstand zwischen den beiden Taps (s)
max_tap_duration = 0.45    # länger gehalten = kein Tap, sondern ein Modifier-Griff

# Mikrofon schon beim zweiten Tastendruck öffnen (nicht erst beim Loslassen),
# damit der Anfang des Diktats nicht abgeschnitten wird. false = klassisch.
early_start = true

# Nur relevant für mode = "combo".
combo = "<ctrl>+<shift>+d"

max_restarts = 5

[audio]
sample_rate = 16000        # Whisper erwartet 16 kHz
channels = 1               # Mono
blocksize = 1024
# device = "MacBook Pro-Mikrofon"   # leer lassen = Systemstandard
max_seconds = 300.0        # harte Obergrenze, danach automatischer Stopp
min_seconds = 0.3          # kürzere Aufnahmen gelten als Fehlbedienung
delete_after_use = true

[pipeline]
# "mlx" = mlx-whisper (Apple Silicon), "stub" = nur protokollieren.
transcriber = "mlx"
whisper_model = "mlx-community/whisper-large-v3-turbo"

# Feste Sprache statt Auto-Erkennung: schneller und zuverlässiger. Bei
# kurzen Diktaten hält Whisper "Danke." sonst gern für Englisch.
language = "de"

# "ollama" korrigiert Interpunktion und Groß-/Kleinschreibung, "none" ist aus.
# Braucht ein laufendes "ollama serve" und ein gezogenes Modell:
#   ollama pull qwen2.5:7b
# Ist Ollama nicht erreichbar, wird das Rohtranskript durchgereicht.
refiner = "none"
ollama_model = "qwen2.5:7b"
ollama_timeout = 20.0

# "clipboard" legt den Text in die Zwischenablage und fügt ihn ein,
# "none" schreibt ihn nur ins Log.
injector = "clipboard"
paste = true                    # false = nur kopieren, von Hand einfügen
restore_clipboard_after = 1.0   # 0 = Transkript in der Zwischenablage lassen

[cleanup]
# Füllwörter entfernen: Zögerlaute ("äh", "ähm", "hm") und doppelte
# Funktionswörter ("ich ich glaube"). Regelbasiert, braucht kein Ollama.
remove_fillers = false

# Wörter, die zusätzlich IMMER entfernt werden. Vorsicht bei mehrdeutigen
# Wörtern: "halt" würde auch aus "Halt an!" verschwinden.
# extra_fillers = ["sozusagen", "quasi"]

[feedback]
sound = true

[logging]
level = "INFO"
to_file = true
