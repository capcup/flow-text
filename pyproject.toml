[project]
name = "flowtext"
version = "1.2.0"
description = "Lokale Voice-to-Text-Engine für macOS (Apple Silicon)"
requires-python = ">=3.11"
dependencies = [
    "pynput>=1.8.2",
    "sounddevice>=0.5.0",
    "soundfile>=0.13.0",
    "numpy>=2.0",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
pipeline = [
    "mlx-whisper>=0.4.1; sys_platform == 'darwin'",
    "ollama>=0.4.0",
    "pyperclip>=1.9.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
flowtext = "flowtext.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["flowtext*"]

# ---------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "BLE"]
ignore = [
    "RUF001",  # ambiguous unicode in Strings (deutsche Umlaute/Pfeile)
    "RUF002",
    "RUF003",
]

# ---------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.11"
# Zielplattform ist macOS; sonst hält mypy die darwin-Zweige für toten Code.
platform = "darwin"
strict = true
warn_unreachable = true
files = ["flowtext", "tools"]

# Diese Pakete liefern keine Type-Stubs mit.
[[tool.mypy.overrides]]
module = ["sounddevice", "soundfile", "pynput.*", "mlx_whisper", "ollama", "pyperclip"]
ignore_missing_imports = true

# Tests dürfen pytest-Fixtures ohne Annotationen verwenden.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_unused_ignores = false

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
